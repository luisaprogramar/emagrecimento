<!DOCTYPE html>
<html lang="pt-BR" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VitaFlow - Gestão Pessoal de Saúde e Evolução</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        rose: {
                            50: '#fff1f2',
                            100: '#ffe4e6',
                            200: '#fecdd3',
                            300: '#fda4af',
                            400: '#fb7185',
                            500: '#f43f5e',
                            600: '#e11d48',
                            700: '#be123c',
                            800: '#9f1239',
                            900: '#881337',
                            pastel: '#fbcfe8',
                            soft: '#fff1f2'
                        }
                    }
                }
            }
        }
    </script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(244, 63, 94, 0.2); border-radius: 9999px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(244, 63, 94, 0.4); }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col transition-colors duration-300">

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col space-y-2"></div>

    <!-- Main Layout Container -->
    <div class="flex h-screen overflow-hidden">

        <!-- Sidebar Navigation -->
        <aside id="sidebar" class="w-64 bg-white dark:bg-slate-800 border-r border-slate-200 dark:border-slate-700 flex flex-col transition-all duration-300 z-30 fixed lg:relative inset-y-0 left-0 transform -translate-x-full lg:translate-x-0">
            <div class="p-6 flex items-center justify-between border-b border-slate-100 dark:border-slate-700">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-rose-500 to-rose-300 flex items-center justify-center text-white shadow-md shadow-rose-500/20">
                        <i data-lucide="activity" class="w-6 h-6"></i>
                    </div>
                    <div>
                        <h1 class="font-bold text-lg bg-gradient-to-r from-rose-600 to-rose-400 bg-clip-text text-transparent">VitaFlow</h1>
                        <p class="text-xs text-slate-400">Evolução & Bem-Estar</p>
                    </div>
                </div>
                <button onclick="toggleSidebar()" class="lg:hidden text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <!-- Navigation Links -->
            <nav class="flex-1 overflow-y-auto p-4 space-y-1.5 custom-scrollbar">
                <button onclick="switchTab('dashboard')" class="nav-btn w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-medium transition-all group active-tab bg-rose-50 dark:bg-rose-950/50 text-rose-600 dark:text-rose-400">
                    <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
                    <span>Dashboard</span>
                </button>
                <button onclick="switchTab('body')" class="nav-btn w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-medium transition-all group text-slate-600 dark:text-slate-400 hover:bg-rose-50/50 dark:hover:bg-slate-700/50 hover:text-rose-600">
                    <i data-lucide="scale" class="w-5 h-5"></i>
                    <span>Acompanhamento Corporal</span>
                </button>
                <button onclick="switchTab('photos')" class="nav-btn w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-medium transition-all group text-slate-600 dark:text-slate-400 hover:bg-rose-50/50 dark:hover:bg-slate-700/50 hover:text-rose-600">
                    <i data-lucide="camera" class="w-5 h-5"></i>
                    <span>Galeria Fotográfica</span>
                </button>
                <button onclick="switchTab('nutrition')" class="nav-btn w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-medium transition-all group text-slate-600 dark:text-slate-400 hover:bg-rose-50/50 dark:hover:bg-slate-700/50 hover:text-rose-600">
                    <i data-lucide="utensils" class="w-5 h-5"></i>
                    <span>Alimentação & Nutrição</span>
                </button>
                <button onclick="switchTab('workouts')" class="nav-btn w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-medium transition-all group text-slate-600 dark:text-slate-400 hover:bg-rose-50/50 dark:hover:bg-slate-700/50 hover:text-rose-600">
                    <i data-lucide="dumbbell" class="w-5 h-5"></i>
                    <span>Treinos & Atividades</span>
                </button>
                <button onclick="switchTab('habits')" class="nav-btn w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-medium transition-all group text-slate-600 dark:text-slate-400 hover:bg-rose-50/50 dark:hover:bg-slate-700/50 hover:text-rose-600">
                    <i data-lucide="check-circle-2" class="w-5 h-5"></i>
                    <span>Hábitos Diários</span>
                </button>
                <button onclick="switchTab('wellness')" class="nav-btn w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-medium transition-all group text-slate-600 dark:text-slate-400 hover:bg-rose-50/50 dark:hover:bg-slate-700/50 hover:text-rose-600">
                    <i data-lucide="heart-pulse" class="w-5 h-5"></i>
                    <span>Bem-Estar & Saúde</span>
                </button>
                <button onclick="switchTab('goals')" class="nav-btn w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-medium transition-all group text-slate-600 dark:text-slate-400 hover:bg-rose-50/50 dark:hover:bg-slate-700/50 hover:text-rose-600">
                    <i data-lucide="target" class="w-5 h-5"></i>
                    <span>Objetivos & Metas</span>
                </button>
                <button onclick="switchTab('calendar')" class="nav-btn w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-medium transition-all group text-slate-600 dark:text-slate-400 hover:bg-rose-50/50 dark:hover:bg-slate-700/50 hover:text-rose-600">
                    <i data-lucide="calendar" class="w-5 h-5"></i>
                    <span>Calendário Geral</span>
                </button>
                <button onclick="switchTab('reports')" class="nav-btn w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-medium transition-all group text-slate-600 dark:text-slate-400 hover:bg-rose-50/50 dark:hover:bg-slate-700/50 hover:text-rose-600">
                    <i data-lucide="bar-chart-3" class="w-5 h-5"></i>
                    <span>Relatórios & Análises</span>
                </button>
                <button onclick="switchTab('settings')" class="nav-btn w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-medium transition-all group text-slate-600 dark:text-slate-400 hover:bg-rose-50/50 dark:hover:bg-slate-700/50 hover:text-rose-600">
                    <i data-lucide="settings" class="w-5 h-5"></i>
                    <span>Configurações & Dados</span>
                </button>
            </nav>

            <!-- Sidebar Footer -->
            <div class="p-4 border-t border-slate-100 dark:border-slate-700">
                <div class="bg-rose-50 dark:bg-rose-950/30 rounded-xl p-3.5 flex items-center justify-between">
                    <div class="flex items-center space-x-3">
                        <div class="w-8 h-8 rounded-full bg-rose-200 dark:bg-rose-900 flex items-center justify-center font-bold text-rose-700 dark:text-rose-300 text-xs">VF</div>
                        <div>
                            <p class="text-xs font-semibold text-slate-700 dark:text-slate-200">Modo Pessoal</p>
                            <p class="text-[10px] text-slate-400">100% Privado & Seguro</p>
                        </div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content Wrapper -->
        <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
            <!-- Top Header -->
            <header class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 h-16 flex items-center justify-between px-6 z-20">
                <div class="flex items-center space-x-4">
                    <button onclick="toggleSidebar()" class="lg:hidden text-slate-500 hover:text-slate-700 dark:hover:text-slate-200">
                        <i data-lucide="menu" class="w-6 h-6"></i>
                    </button>
                    <h2 id="current-tab-title" class="text-lg font-bold text-slate-800 dark:text-slate-100">Dashboard Geral</h2>
                </div>
                <div class="flex items-center space-x-3">
                    <!-- Quick Water Counter widget -->
                    <div class="hidden sm:flex items-center space-x-2 bg-rose-50 dark:bg-rose-950/40 px-3 py-1.5 rounded-full border border-rose-100 dark:border-rose-900/50">
                        <i data-lucide="droplets" class="w-4 h-4 text-rose-500"></i>
                        <span class="text-xs font-medium text-rose-700 dark:text-rose-300"><span id="header-water-count">0</span>/2000ml</span>
                        <button onclick="quickAddWater()" class="w-5 h-5 rounded-full bg-rose-500 text-white flex items-center justify-center hover:bg-rose-600 text-xs font-bold">+</button>
                    </div>
                    <!-- Theme Toggle -->
                    <button onclick="toggleTheme()" class="w-10 h-10 rounded-xl bg-slate-100 dark:bg-slate-700 flex items-center justify-center text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-600 transition-colors">
                        <i data-lucide="sun" class="w-5 h-5 hidden dark:block"></i>
                        <i data-lucide="moon" class="w-5 h-5 block dark:hidden"></i>
                    </button>
                </div>
            </header>

            <!-- Scrollable Content Area -->
            <main id="main-content" class="flex-1 overflow-y-auto p-6 bg-slate-50 dark:bg-slate-900 custom-scrollbar">
                <!-- Content injected dynamically by JS -->
            </main>
        </div>
    </div>

    <!-- Modal Generic Container -->
    <div id="modal-container" class="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm hidden items-center justify-center p-4">
        <div id="modal-content" class="bg-white dark:bg-slate-800 rounded-2xl max-w-lg w-full max-h-[90vh] overflow-y-auto shadow-2xl border border-slate-100 dark:border-slate-700 p-6">
            <!-- Modal Content Loaded Dynamically -->
        </div>
    </div>

    <!-- Application JavaScript Logic -->
    <script>
        // --- State Management & Persistence ---
        const STORAGE_KEY = 'vitaflow_data_v1';
        
        let db = {
            profile: { name: 'Usuário', unit: 'kg', startWeight: 70 },
            bodyRecords: [], // { id, date, weight, waist, abdomen, hip, thighs, arms, notes }
            photos: [], // { id, date, image, notes }
            nutrition: {
                meals: [], // { id, date, type, time, description, notes }
                water: 0, // in ml
                favorites: [] // { name, type }
            },
            workouts: {
                sessions: [], // { id, date, type, name, duration, exercises: [{name, sets, reps, weight}], notes, completed }
                routine: { 1: 'Musculação A', 2: 'Cardio', 3: 'Musculação B', 4: 'Descanso', 5: 'Musculação C', 6: 'Cardio', 0: 'Descanso' }
            },
            habits: {
                customHabits: [
                    { id: 'water', name: 'Beber Água regularmente', icon: 'droplets' },
                    { id: 'diet', name: 'Alimentação variada', icon: 'utensils' },
                    { id: 'sleep', name: 'Dormir adequadamente (7h+)', icon: 'moon' },
                    { id: 'exercise', name: 'Praticar atividade física', icon: 'dumbbell' },
                    { id: 'stretch', name: 'Fazer alongamentos', icon: 'activity' }
                ],
                logs: {} // { 'YYYY-MM-DD': { habitId: true/false } }
            },
            wellness: [], // { id, date, sleepHours, sleepQuality, energy, mood, stress, notes }
            goals: [], // { id, title, description, category, deadline, status, progress, notes }
            notes: {} // { 'YYYY-MM-DD': 'nota do dia' }
        };

        function loadData() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try {
                    db = JSON.parse(saved);
                } catch (e) {
                    console.error('Erro ao carregar dados:', e);
                }
            } else {
                seedInitialData();
            }
        }

        function saveData() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
            updateHeaderWater();
        }

        function seedInitialData() {
            const today = new Date();
            const formatDate = (d) => d.toISOString().split('T')[0];
            
            for(let i=5; i>=0; i--) {
                const d = new Date();
                d.setDate(today.getDate() - i * 7);
                db.bodyRecords.push({
                    id: 'body_' + i,
                    date: formatDate(d),
                    weight: (70 - i * 0.4).toFixed(1),
                    waist: (75 - i * 0.3).toFixed(1),
                    abdomen: (82 - i * 0.4).toFixed(1),
                    hip: (98 - i * 0.2).toFixed(1),
                    thighs: (56 - i * 0.1).toFixed(1),
                    arms: (30 - i * 0.1).toFixed(1),
                    notes: 'Acompanhamento regular de evolução.'
                });
            }

            for(let i=3; i>=0; i--) {
                const d = new Date();
                d.setDate(today.getDate() - i);
                db.wellness.push({
                    id: 'well_' + i,
                    date: formatDate(d),
                    sleepHours: 7.5,
                    sleepQuality: 'Boa',
                    energy: 8,
                    mood: 'Equilibrado(a)',
                    stress: 3,
                    notes: 'Dia tranquilo e produtivo.'
                });
            }

            db.goals.push({
                id: 'goal_1',
                title: 'Consistência nos Treinos',
                description: 'Manter 4 treinos por semana sem rigidez excessiva.',
                category: 'Treinos',
                deadline: '2026-12-31',
                status: 'Em Andamento',
                progress: 75,
                notes: 'Focar na constância.'
            });
            db.goals.push({
                id: 'goal_2',
                title: 'Qualidade do Sono',
                description: 'Dormir pelo menos 7 horas por Noite.',
                category: 'Bem-Estar',
                deadline: '2026-06-30',
                status: 'Em Andamento',
                progress: 80,
                notes: 'Desligar telas 30 min antes.'
            });

            db.workouts.sessions.push({
                id: 'work_1',
                date: formatDate(today),
                type: 'Musculação',
                name: 'Membros Inferiores & Core',
                duration: '50 min',
                exercises: [
                    { name: 'Agachamento Livre', sets: 4, reps: '10-12', weight: '40kg' },
                    { name: 'Elevação Pélvica', sets: 3, reps: '12', weight: '50kg' }
                ],
                notes: 'Excelente treino, ótima disposição.',
                completed: true
            });

            db.nutrition.water = 1500;
            db.nutrition.meals.push({
                id: 'meal_1',
                date: formatDate(today),
                type: 'Café da Manhã',
                time: '08:00',
                description: 'Ovos mexidos, pão integral e café com leite.',
                notes: 'Refeição nutritiva e saborosa.'
            });

            saveData();
        }

        let currentActiveTab = 'dashboard';

        function switchTab(tabId) {
            currentActiveTab = tabId;
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('bg-rose-50', 'dark:bg-rose-950/50', 'text-rose-600', 'dark:text-rose-400');
                btn.classList.add('text-slate-600', 'dark:text-slate-400');
            });
            
            event && event.currentTarget && event.currentTarget.classList.add('bg-rose-50', 'dark:bg-rose-950/50', 'text-rose-600', 'dark:text-rose-400');
            
            if(window.innerWidth < 1024) {
                toggleSidebar();
            }

            renderCurrentView();
            lucide.createIcons();
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('-translate-x-full');
        }

        function toggleTheme() {
            const html = document.documentElement;
            if(html.classList.contains('dark')) {
                html.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            } else {
                html.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            }
        }

        if(localStorage.getItem('theme'] === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `flex items-center space-x-2 px-4 py-3 rounded-xl shadow-lg text-sm font-medium text-white transition-all transform translate-y-2 opacity-0 ${type === 'success' ? 'bg-rose-600' : 'bg-slate-700'}`;
            toast.innerHTML = `<i data-lucide="${type === 'success' ? 'check-circle' : 'info'}" class="w-4 h-4"></i><span>${message}</span>`;
            container.appendChild(toast);
            lucide.createIcons();
            
            setTimeout(() => { toast.classList.remove('translate-y-2', 'opacity-0'); }, 10);
            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function updateHeaderWater() {
            const el = document.getElementById('header-water-count');
            if(el) el.innerText = db.nutrition.water;
        }

        function quickAddWater() {
            db.nutrition.water = Math.min(4000, db.nutrition.water + 250);
            saveData();
            showToast('+250ml de água registrado!');
            if(currentActiveTab === 'nutrition') renderNutritionView();
        }

        function renderCurrentView() {
            const titles = {
                dashboard: 'Dashboard Geral',
                body: 'Acompanhamento Corporal',
                photos: 'Galeria Fotográfica Privada',
                nutrition: 'Alimentação & Nutrição',
                workouts: 'Treinos & Atividades Físicas',
                habits: 'Habit Tracker',
                wellness: 'Bem-Estar & Saúde',
                goals: 'Objetivos & Metas',
                calendar: 'Calendário Geral',
                reports: 'Relatórios de Evolução',
                settings: 'Configurações & Dados'
            };
            document.getElementById('current-tab-title').innerText = titles[currentActiveTab] || 'VitaFlow';

            const container = document.getElementById('main-content');
            container.innerHTML = '';

            switch(currentActiveTab) {
                case 'dashboard': renderDashboardView(container); break;
                case 'body': renderBodyView(container); break;
                case 'photos': renderPhotosView(container); break;
                case 'nutrition': renderNutritionView(container); break;
                case 'workouts': renderWorkoutsView(container); break;
                case 'habits': renderHabitsView(container); break;
                case 'wellness': renderWellnessView(container); break;
                case 'goals': renderGoalsView(container); break;
                case 'calendar': renderCalendarView(container); break;
                case 'reports': renderReportsView(container); break;
                case 'settings': renderSettingsView(container); break;
            }
            lucide.createIcons();
        }

        function renderDashboardView(container) {
            const latestBody = db.bodyRecords.length > 0 ? db.bodyRecords[db.bodyRecords.length - 1] : { weight: '--', waist: '--' };
            const weekWorkouts = db.workouts.sessions.filter(s => s.completed).length;
            const avgSleep = db.wellness.length > 0 ? (db.wellness.reduce((acc, cur) => acc + cur.sleepHours, 0) / db.wellness.length).toFixed(1) : '--';
            const avgEnergy = db.wellness.length > 0 ? (db.wellness.reduce((acc, cur) => acc + cur.energy, 0) / db.wellness.length).toFixed(0) : '--';

            container.innerHTML = `
                <div class="space-y-6 max-w-7xl mx-auto">
                    <div class="bg-gradient-to-r from-rose-500 to-rose-400 rounded-2xl p-6 text-white shadow-xl shadow-rose-500/10 flex flex-col md:flex-row items-center justify-between">
                        <div class="space-y-2 mb-4 md:mb-0">
                            <span class="bg-white/25 px-3 py-1 rounded-full text-xs font-semibold uppercase tracking-wider">Espaço Pessoal</span>
                            <h3 class="text-2xl font-bold">Consistência, saúde e bem-estar em primeiro lugar.</h3>
                            <p class="text-rose-100 text-sm max-w-xl">"Cada pequeno hábito construído hoje é um investimento no seu bem-estar de amanhã. Sem pressa, sem cobranças."</p>
                        </div>
                        <button onclick="switchTab('habits')" class="bg-white text-rose-600 hover:bg-rose-50 px-5 py-2.5 rounded-xl font-semibold text-sm transition-all shadow-md">
                            Ver Hábitos de Hoje
                        </button>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                        <div class="bg-white dark:bg-slate-800 p-5 rounded-2xl border border-slate-100 dark:border-slate-700 shadow-sm flex items-center justify-between">
                            <div>
                                <p class="text-xs font-medium text-slate-400 uppercase">Peso Atual</p>
                                <h4 class="text-2xl font-bold text-slate-800 dark:text-slate-100 mt-1">${latestBody.weight} <span class="text-sm font-normal text-slate-400">${db.profile.unit}</span></h4>
                                <span class="text-xs text-rose-500 font-medium flex items-center mt-1"><i data-lucide="trending-up" class="w-3 h-3 mr-1"></i> Acompanhamento ativo</span>
                            </div>
                            <div class="w-12 h-12 rounded-2xl bg-rose-50 dark:bg-rose-950/50 text-rose-500 flex items-center justify-center">
                                <i data-lucide="scale" class="w-6 h-6"></i>
                            </div>
                        </div>

                        <div class="bg-white dark:bg-slate-800 p-5 rounded-2xl border border-slate-100 dark:border-slate-700 shadow-sm flex items-center justify-between">
                            <div>
                                <p class="text-xs font-medium text-slate-400 uppercase">Treinos Realizados</p>
                                <h4 class="text-2xl font-bold text-slate-800 dark:text-slate-100 mt-1">${weekWorkouts} <span class="text-sm font-normal text-slate-400">sessões</span></h4>
                                <span class="text-xs text-emerald-500 font-medium flex items-center mt-1"><i data-lucide="check-circle-2" class="w-3 h-3 mr-1"></i> Ritmo constante</span>
                            </div>
                            <div class="w-12 h-12 rounded-2xl bg-rose-50 dark:bg-rose-950/50 text-rose-500 flex items-center justify-center">
                                <i data-lucide="dumbbell" class="w-6 h-6"></i>
                            </div>
                        </div>

                        <div class="bg-white dark:bg-slate-800 p-5 rounded-2xl border border-slate-100 dark:border-slate-700 shadow-sm flex items-center justify-between">
                            <div>
                                <p class="text-xs font-medium text-slate-400 uppercase">Média Sono</p>
                                <h4 class="text-2xl font-bold text-slate-800 dark:text-slate-100 mt-1">${avgSleep} <span class="text-sm font-normal text-slate-400">horas</span></h4>
                                <span class="text-xs text-blue-500 font-medium flex items-center mt-1"><i data-lucide="moon" class="w-3 h-3 mr-1"></i> Descanso adequado</span>
                            </div>
                            <div class="w-12 h-12 rounded-2xl bg-rose-50 dark:bg-rose-950/50 text-rose-500 flex items-center justify-center">
                                <i data-lucide="moon" class="w-6 h-6"></i>
                            </div>
                        </div>

        function saveBodyRecord(e, id) {
            e.preventDefault();
            const record = {
                id: id && id !== "" ? id : 'body_' + Date.now(),
                date: document.getElementById('body-date').value,
                weight: document.getElementById('body-weight').value,
                waist: document.getElementById('body-waist').value,
                abdomen: document.getElementById('body-abdomen').value,
                hip: document.getElementById('body-hip').value,
                thighs: document.getElementById('body-thighs').value,
                arms: document.getElementById('body-arms').value,
                notes: document.getElementById('body-notes').value
            };

            if(id && id !== "") {
                const idx = db.bodyRecords.findIndex(r => r.id === id);
                if(idx !== -1) db.bodyRecords[idx] = record;
            } else {
                db.bodyRecords.push(record);
            }

            saveData();
            closeModal();
            renderCurrentView();
            showToast('Registro corporal salvo com sucesso!');
        }

        function editBodyRecord(id) { 
            openBodyModal(id); 
        }

        function deleteBodyRecord(id) {
            db.bodyRecords = db.bodyRecords.filter(r => r.id !== id);
            saveData();
            renderCurrentView();
            showToast('Registro excluído com sucesso.', 'info');
        }

        function closeModal() {
            const modal = document.getElementById('modal-container');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
